<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>IstanbulPrintLab — Yönetim Paneli</title>
  <style>
    /* Telefonda kullanım: Decap'in 800 px sabit genişliğini kaldır, üst çubuğu alt satıra sar */
    @media (max-width: 799px) {
      [class*="EditorContainer"], [class*="ToolbarContainer"] { min-width: 0 !important; }
      [class*="ToolbarContainer"] { flex-wrap: wrap !important; height: auto !important; padding: 4px !important; }
      [class*="ToolbarSectionMain"], [class*="ToolbarSubSectionFirst"], [class*="ToolbarSubSectionLast"] { flex-wrap: wrap !important; }
      [class*="ToolbarSectionBackLink"] { padding: 8px !important; min-width: 0 !important; }
      [class*="ControlPaneContainer"], [class*="EditorControlPane"] { padding: 12px !important; max-width: 100% !important; }
      [class*="ViewControls"] { display: none !important; }
      input, textarea, select { font-size: 16px !important; }
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
